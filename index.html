<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ezshopia AI Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel Standalone for potential TSX support in some previewers -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- CRITICAL POLYFILLS -->
    <script>
      window.process = {
        env: { NODE_ENV: 'development', API_KEY: '' },
        version: ''
      };
      window.Buffer = window.Buffer || {
        isBuffer: function() { return false; },
        from: function(data) { return data; }
      };
      
      // Standard Error Handler
      window.onerror = function(msg, src, line, col, error) {
        if (msg === 'Script error.') return;
        console.error("Global Error:", error);
      };
    </script>

    <!-- Strict Import Map with Dependency Locking -->
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0",
    "@google/genai": "https://esm.sh/@google/genai@0.2.1",
    "clsx": "https://esm.sh/clsx@2.1.0",
    "tailwind-merge": "https://esm.sh/tailwind-merge@2.2.0",
    "next/font/google": "https://esm.sh/@vercel/stubs",
    "tailwindcss": "https://esm.sh/tailwindcss@^4.1.18",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "next/": "https://esm.sh/next@^16.1.1/",
    "next": "https://esm.sh/next@^16.1.1"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root">
      <div style="height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; color: #666;">
        <!-- Loading Spinner -->
        <svg style="width: 40px; height: 40px; animation: spin 1s linear infinite; color: #3b82f6;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle style="opacity: 0.25;" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path style="opacity: 0.75;" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <div style="margin-top: 15px; font-family: sans-serif; font-size: 14px;">Loading Application...</div>
      </div>
      <style>@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }</style>
    </div>
    
    <!-- Load index.tsx module -->
    <script type="module" src="./index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
